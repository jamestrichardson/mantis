name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Mantis (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Run deterministic test suite
        run: pytest

  build-package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: pip install --no-cache-dir build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify build artifacts exist
        run: |
          ls dist/*.whl
          ls dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: mantis-dist
          path: dist/
          retention-days: 7

  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: mantis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 image into the local Docker daemon for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: mantis:ci-smoke
          cache-from: type=gha

      - name: Container smoke test (#21) -- real service, PID1, /healthz, /readyz, SIGTERM
        run: |
          set -euo pipefail
          container_id=$(docker run -d \
            -p 18080:8080 \
            -e MANTIS_API_TOKEN=ci-smoke-token \
            -e LITELLM_URL=http://localhost:4000 \
            -e LITELLM_API_KEY=ci-smoke-key \
            -e AWX_URL=https://awx.example.test \
            -e AWX_TOKEN=ci-smoke-token \
            mantis:ci-smoke)
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          pid1_cmd=$(docker top "$container_id" | tail -n +2 | head -n 1)
          case "$pid1_cmd" in
            *mantis\ serve) ;;
            *) echo "PID1 was '$pid1_cmd', expected a 'mantis serve' process (no resident sleep infinity)"; exit 1 ;;
          esac

          for _ in $(seq 1 30); do
            curl -sf http://localhost:18080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:18080/healthz | grep -q '"status":"ok"'
          curl -sf http://localhost:18080/readyz | grep -q '"status":"ready"'
          curl -sf http://localhost:18080/api/v1/agents -H "Authorization: Bearer ci-smoke-token" \
            | grep -q '"system-troubleshooter"'
          curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/api/v1/agents | grep -q '^401$'

          docker stop -t 15 "$container_id"
          container_status=$(docker inspect -f '{{.State.Status}}' "$container_id")
          [ "$container_status" = "exited" ] || { echo "Container did not exit cleanly after SIGTERM (status: $container_status)"; exit 1; }
