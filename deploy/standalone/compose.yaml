services:
  mantis:
    image: ${MANTIS_IMAGE_REF:?MANTIS_IMAGE_REF must be set by mantis-deploy}
    container_name: mantis
    restart: unless-stopped

    env_file:
      - runtime.env

    environment:
      MANTIS_DEPLOYED_TAG: ${MANTIS_DEPLOYED_TAG:-unknown}
      MANTIS_HEALTH_URL: ${MANTIS_HEALTH_URL:-http://127.0.0.1:8080/readyz}

    # The API port is bound to localhost only -- the bearer-token API
    # (#83) has no TLS boundary of its own, so it must never be reachable
    # directly on a public/host interface. Remote access requires an
    # explicit reverse proxy/ingress terminating TLS and forwarding to
    # 127.0.0.1:8080 -- see docs/api.md#transport-security-tls. The
    # metrics port is exposed on all interfaces as before, matching its
    # existing (pre-#21) exposure posture; it carries no credential.
    ports:
      - "127.0.0.1:8080:8080"
      - "9108:9108"

    # `mantis serve` (#21/#83) is the real persistent service and the
    # image's own default command -- no override needed for normal
    # operation. MANTIS_CONTAINER_COMMAND remains available for an
    # operator who deliberately needs to run something else in this
    # container (e.g. a one-off debugging shell), without changing the
    # deployment primitive.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "${MANTIS_CONTAINER_COMMAND:-exec mantis serve}"

    # Docker sends SIGTERM, then SIGKILL after this elapses if the
    # container hasn't exited on its own. Must stay comfortably above
    # MANTIS_API_SHUTDOWN_GRACE_PERIOD_SECONDS (the *application's* own
    # bounded drain window, default 30s -- see docs/deployment.md's
    # "Graceful shutdown" section) or Docker kills the process before
    # Mantis's own documented grace period has had a chance to elapse.
    # If you change MANTIS_API_SHUTDOWN_GRACE_PERIOD_SECONDS in
    # runtime.env, raise MANTIS_STOP_GRACE_PERIOD here to match (leave a
    # buffer of at least 10s for OS/Docker overhead).
    stop_grace_period: ${MANTIS_STOP_GRACE_PERIOD:-40s}

    healthcheck:
      # The deployment health gate (mantis-deploy) polls this Docker
      # healthcheck, which in turn polls the real /readyz contract --
      # never a synthetic liveness-only substitute. See docs/deployment.md.
      #
      # Runs the baked-in bash-only probe (deploy/standalone/healthcheck.sh,
      # #97), not a `python -c 'import urllib.request; ...'` one-liner --
      # on a slow/constrained host, Python interpreter startup and import
      # machinery alone could exceed this healthcheck's own `timeout`,
      # marking a genuinely ready service unhealthy. The probe has its
      # own internal read timeout (MANTIS_HEALTHCHECK_PROBE_TIMEOUT_SECONDS,
      # default 3s); `timeout: 5s` below leaves ~2s of margin beyond that
      # for bash/exec overhead, and `start_period` gives the service
      # itself room to start on a slow host -- neither exists because the
      # probe is expensive; it typically completes in low milliseconds.
      test: ["CMD", "/usr/local/bin/mantis-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
