[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mantis"
version = "1.6.0"
description = "Monitoring, Automation, Network Triage & Infrastructure System — an operations-focused AI agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "James Richardson" }]
dependencies = [
    "openai>=3.13.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.20.0",
    "kubernetes>=32.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

[project.scripts]
mantis = "mantis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mantis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
